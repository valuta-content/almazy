<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои алмазы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js?v=4"></script>
<style>
:root{
  --bg:#eef1f6; --card:#ffffff; --fg:#17202e; --muted:#667085; --line:#e2e6ee;
  --gem:#14b8c9; --plus:#15803d; --minus:#b42318; --soft:#e8f1ff;
}
:root[data-theme="dark"]{
  --bg:#0f141c; --card:#18202b; --fg:#e8edf5; --muted:#93a0b4; --line:#273242;
  --gem:#3fd3e2; --plus:#4ade80; --minus:#f97066; --soft:#1c2a40; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:16px max(16px,env(safe-area-inset-left)) calc(32px + env(safe-area-inset-bottom))}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero{align-items:center;text-align:center;padding:24px 16px}
.who{color:var(--muted);font-size:14px}
.num{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.num span{color:var(--gem)}
h2{margin:0;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding-block:8px;border-top:1px solid var(--line)}
.week+.row{border-top:0}
.row .t{min-width:0}
.v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.v.p{color:var(--plus)} .v.m{color:var(--minus)}
.week{font-size:12px;font-weight:600;color:var(--muted);padding-top:6px}
.reward{display:flex;flex-direction:column;gap:6px;padding-block:8px;border-top:1px solid var(--line)}
.reward:first-child{border-top:0}
.top{display:flex;justify-content:space-between;gap:12px}
.name{font-weight:600}
.price{font-weight:700;white-space:nowrap}
.desc{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gem)}
.state{font-size:12px;font-weight:600}
.ok{color:var(--plus)} .wait{color:var(--muted)}
ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.how{background:var(--soft);border-radius:12px;padding:12px;font-size:14px}
.msg{text-align:center;padding:32px 16px;align-items:center}
.msg .gem{font-size:48px}
.empty{color:var(--muted);font-size:14px}
.task{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;
  font:inherit;color:var(--fg);background:var(--soft);border:0;border-radius:12px;padding:12px 14px;cursor:pointer}
.task+.task{margin-top:8px}
.task .tn{min-width:0;font-weight:600}
.task .tn small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.task .ta{font-weight:700;color:var(--plus);white-space:nowrap}
.task[disabled]{background:transparent;border:1px solid var(--line);cursor:default}
.task[disabled] .tn{color:var(--muted)}
.task[disabled] .ta{color:var(--muted)}
.rbtn{margin-top:4px;font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 12px;background:var(--gem);color:#fff;cursor:pointer}
.rbtn[disabled]{background:var(--line);color:var(--muted);cursor:default}
.pend{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px}
.pend button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:9px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.sup{display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;color:var(--fg);background:var(--card);border:0;border-radius:16px;padding:14px;cursor:pointer;text-decoration:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90%;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="card msg"><div class="gem">💎</div><div>Загружаю твои алмазы…</div></div>
</div>
<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  var root = document.getElementById('root');
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
  var dark = tg && tg.colorScheme ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function msg(text){ root.innerHTML = '<div class="card msg"><div class="gem">💎</div><div>' + text + '</div></div>'; }

  if (!tg || !tg.initData) { msg('Открой «Мои алмазы» через кнопку в боте клуба в Telegram.'); return; }
  if (!window.ALMAZY_API) { msg('Приложение ещё настраивается. Загляни чуть позже.'); return; }

  var busy = false;
  function load(extra){
    return fetch(window.ALMAZY_API + '?initData=' + encodeURIComponent(tg.initData) + (extra || ''))
      .then(function(r){ return r.json(); });
  }
  load().then(render).catch(function(){ msg('Не получилось загрузить данные. Закрой приложение и открой ещё раз.'); });

  function toast(text){
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
    document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2600);
  }
  function confirmBox(text, cb){
    if (tg.showConfirm) { try { tg.showConfirm(text, cb); return; } catch(e){} }
    cb(true);
  }
  function act(extra, after){
    if (busy) return;
    busy = true;
    load(extra).then(function(d){ busy = false; render(d); after && after(d); })
      .catch(function(){ busy = false; toast('Не получилось. Попробуй ещё раз.'); });
  }
  function haptic(){ try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){} }
  function openLink(url){
    if (!url) return;
    try { if (/^https:\/\/t\.me\//.test(url) && tg.openTelegramLink) { tg.openTelegramLink(url); return; } } catch(e){}
    try { tg.openLink(url); } catch(e){ location.href = url; }
  }
  function mark(name, amount){
    confirmBox('Отметить «' + name + '»? +' + amount + ' 💎', function(ok){
      if (!ok) return;
      act('&action=mark&task=' + encodeURIComponent(name), function(d){
        if (d.result && d.result.ok) { toast('Принято! +' + d.result.amount + ' 💎'); haptic(); }
        else toast('Уже отмечено');
      });
    });
  }
  var WHY = { balance:'Не хватает алмазов', no_slots:'Места на этот месяц закончились', already:'Эту награду ты уже брала в этом месяце' };
  function redeem(r){
    confirmBox('Обменять ' + r.price + ' 💎 на «' + r.name + '»? Отменить можно в течение 24 часов.', function(ok){
      if (!ok) return;
      act('&action=redeem&reward=' + encodeURIComponent(r.name), function(d){
        var x = d.result || {};
        if (!x.ok) { toast(WHY[x.reason] || 'Не получилось. Попробуй ещё раз.'); return; }
        haptic();
        if (x.link) {
          var go = function(){ openLink(x.link); };
          if (tg.showPopup) { try { tg.showPopup({ title:'Готово! −' + x.price + ' 💎', message:'Обязательно отправь Оле сообщение об обмене, без него она не узнает о твоей заявке. Сейчас откроется чат с готовым текстом, просто нажми «Отправить».', buttons:[{id:'go', type:'default', text:'Написать Оле'}] }, go); return; } catch(e){} }
          go();
        } else {
          toast('Готово! −' + x.price + ' 💎. Напиши Оле, что обменяла алмазы.');
        }
      });
    });
  }
  function cancel(h){
    confirmBox('Отменить обмен «' + h.title.replace('Обмен: ', '') + '»? Алмазы вернутся на баланс.', function(ok){
      if (!ok) return;
      act('&action=cancel&row=' + h.row, function(d){
        if (d.result && d.result.ok) { toast('Обмен отменён, алмазы вернулись'); haptic(); }
        else toast('Этот обмен уже нельзя отменить');
      });
    });
  }
  var PER = { once:'', week:' на этой неделе', month:' в этом месяце', none:'' };

  function render(d){
    if (!d.ok) {
      var why = { no_token:'не введён токен бота', bad_auth:'Telegram не подтвердил вход', server:'ошибка в таблице' }[d.error] || d.error;
      msg('Не получилось загрузить данные (' + esc(why) + '). Закрой приложение и открой ещё раз.'); return;
    }
    if (d.soon) { msg((d.first_name ? esc(d.first_name) + ', с' : 'С') + 'коро здесь появятся твои алмазы 💎'); return; }

    var h = '';
    h += '<div class="card hero"><div class="who">' + esc(d.first_name || d.name) + ', твой баланс</div>' +
         '<div class="num">' + d.balance + ' <span>💎</span></div></div>';

    var pending = (d.history || []).filter(function(x){ return x.cancellable; });
    if (pending.length) {
      h += '<div class="card"><h2>Обмен в обработке</h2>';
      pending.forEach(function(x){
        h += '<div class="pend"><span>' + esc(x.title.replace('Обмен: ', '')) + ' · ' + Math.abs(x.amount) + ' 💎</span>' +
             '<button data-cancel="' + x.row + '">Отменить</button></div>';
      });
      h += '<div class="desc">Отменить можно в течение ' + (d.cancel_hours || 24) + ' часов после обмена.</div></div>';
    }

    if (d.tasks && d.tasks.length) {
      h += '<div class="card"><h2>Отметить</h2><div id="tasks">';
      d.tasks.forEach(function(t, i){
        var note = t.period === 'none' ? 'за каждый' : t.available
          ? (t.limit > 1 ? 'можно ещё ' + (t.limit - t.used) + PER[t.period] : (t.period === 'once' ? 'засчитывается один раз' : 'один раз' + PER[t.period]))
          : (t.period === 'once' ? '✓ уже засчитано' : '✓ засчитано' + PER[t.period]);
        h += '<button class="task" data-i="' + i + '"' + (t.available ? '' : ' disabled') + '>' +
             '<span class="tn">' + esc(t.name) + '<small>' + note + '</small></span>' +
             '<span class="ta">+' + t.amount + '</span></button>';
      });
      h += '</div></div>';
    }

    if (d.rewards && d.rewards.length) {
      h += '<div class="card"><h2>Награды</h2><div>';
      d.rewards.forEach(function(r, i){
        var pct = r.price > 0 ? Math.max(0, Math.min(100, Math.round(d.balance / r.price * 100))) : 100;
        var state = r.state || (d.balance >= r.price ? 'can' : 'need');
        var line = state === 'can' ? '<button class="rbtn" data-r="' + i + '">Обменять</button>'
          : state === 'no_slots' ? '<div class="state wait">Места на этот месяц закончились</div>'
          : state === 'already' ? '<div class="state ok">✓ Уже взяла в этом месяце</div>'
          : '<div class="state wait">Осталось ' + (r.price - d.balance) + ' 💎</div>';
        h += '<div class="reward"><div class="top"><span class="name">' + esc(r.name) + '</span><span class="price">' + r.price + ' 💎</span></div>' +
             (r.desc ? '<div class="desc">' + esc(r.desc) + '</div>' : '') +
             '<div class="bar"><i style="width:' + pct + '%"></i></div>' + line +
             (state === 'can' && r.left != null ? '<div class="desc">Осталось мест в этом месяце: ' + r.left + '</div>' : '') + '</div>';
      });
      h += '</div></div>';
    }

    h += '<div class="card"><h2>За что начислено</h2>';
    if (!d.history.length) h += '<div class="empty">Пока начислений нет. Сдай ДЗ в чат клуба с хэштегом, например #дз_урок1, и алмазы появятся здесь.</div>';
    var last = null;
    d.history.forEach(function(x){
      if (x.date !== last) { h += '<div class="week">' + esc(x.date) + '</div>'; last = x.date; }
      var title = esc(x.title) + (x.status === 'cancelled' ? ' <span class="desc">· отменён, алмазы возвращены</span>' : x.status === 'done' ? ' <span class="desc">· выполнено</span>' : '');
      var amt = x.status === 'cancelled' ? '0' : (x.amount > 0 ? '+' : x.amount < 0 ? '−' : '') + Math.abs(x.amount);
      h += '<div class="row"><span class="t">' + title + '</span><span class="v ' + (x.amount < 0 ? 'm' : 'p') + '">' + amt + '</span></div>';
    });
    h += '</div>';

    if (d.rules && d.rules.length) {
      h += '<div class="card"><h2>Правила</h2><ul>' + d.rules.map(function(r){ return '<li>' + esc(r) + '</li>'; }).join('') + '</ul></div>';
    }
    if (d.support) h += '<button class="sup" id="sup">💬 Поддержка: задать вопрос</button>';
    root.innerHTML = h;

    root.onclick = function(e){
      var b = e.target.closest('button'); if (!b || b.disabled) return;
      if (b.id === 'sup') { openLink(d.support); return; }
      if (b.hasAttribute('data-i')) { var t = d.tasks[Number(b.getAttribute('data-i'))]; mark(t.name, t.amount); return; }
      if (b.hasAttribute('data-r')) { redeem(d.rewards[Number(b.getAttribute('data-r'))]); return; }
      if (b.hasAttribute('data-cancel')) {
        var row = Number(b.getAttribute('data-cancel'));
        var x = d.history.filter(function(y){ return y.row === row; })[0]; if (x) cancel(x);
      }
    };
  }
})();
</script>
</body>
</html>
